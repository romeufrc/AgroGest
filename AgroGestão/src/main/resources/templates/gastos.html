<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroGestor - Controle Financeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-logo {
            width: 38px; height: 38px; background-color: #198754; color: white;
            display: flex; align-items: center; justify-content: center; border-radius: 50%;
        }
    </style>
</head>
<body>
<!-- Icones para os botoes de editar e excluir -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Puxa o menu lateral escondido -->
<div th:replace="~{sidebar :: sidebar}"></div>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mt-3 mx-3 rounded-3 ps-5">
    <div class="container-fluid px-3">
        <div class="d-flex align-items-center">
            <!-- Botao de tres tracinhos que abre a sidebar -->
            <button class="btn btn-link link-dark p-0 me-3 text-decoration-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarAgroGestor" aria-controls="sidebarAgroGestor">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>

            <a th:href="@{/}" class="text-decoration-none d-flex align-items-center text-dark">
                <div class="navbar-logo me-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                    </svg>
                </div>
                <div>
                    <h2 class="navbar-brand mb-0 fw-bold fs-5">AgroGestor</h2>
                    <span class="text-muted small d-block" style="margin-top: -4px;">Fluxo de Caixa</span>
                </div>
            </a>
        </div>
    </div>
</nav>

<main class="container my-5" style="max-width: 1100px;">

    <div class="card border-0 bg-danger bg-opacity-10 text-danger p-4 mb-4 rounded-3 shadow-sm">
        <div class="d-flex align-items-center justify-content-between">
            <div>
                <span class="small fw-semibold text-uppercase tracking-wider">Custo Total Acumulado</span>
                <h2 class="display-6 fw-bold mb-0 mt-1" th:text="'R$ ' + ${totalGasto}">R$ 0,00</h2>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-12 col-lg-4">
            <div class="card border-light shadow-sm p-4 bg-white">
                <!-- Muda o titulo do form se for uma edicao -->
                <h3 class="h5 fw-bold text-dark mb-4" th:text="${novoGasto.id != null} ? 'Editar Despesa' : 'Lançar Despesa'">Lançar Despesa</h3>

                <form th:action="@{/gastos-view/salvar}" th:object="${novoGasto}" method="POST">
                    <!-- Guarda o ID do gasto que esta sendo editado -->
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Descrição do Gasto</label>
                        <input type="text" th:field="*{descricao}" placeholder="Ex: Adubo, Combustível" class="form-control text-sm" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Valor (R$)</label>
                        <input type="number" step="0.01" th:field="*{valor}" placeholder="0.00" class="form-control text-sm" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Data</label>
                        <input type="date" th:field="*{dataGasto}" class="form-control text-sm" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Propriedade Vinculada</label>
                        <select th:field="*{propriedade}" class="form-select text-sm" required>
                            <option th:each="prop : ${propriedades}" th:value="${prop.id}" th:text="${prop.nome}">Fazenda</option>
                        </select>
                    </div>

                    <div class="d-flex gap-2 mt-3">
                        <!-- Botao de cancelar (so aparece se estiver editando) -->
                        <a th:if="${novoGasto.id != null}" th:href="@{/gastos-view}" class="btn btn-light w-50 py-2 fw-medium">Cancelar</a>
                        <button type="submit" class="btn btn-danger fw-medium py-2" th:classappend="${novoGasto.id != null} ? 'w-50' : 'w-100'">
                            Registrar Despesa
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-12 col-lg-8">
            <div class="card border-light shadow-sm p-4 bg-white h-100">
                <h3 class="h5 fw-bold text-dark mb-4">Histórico Financeiro</h3>

                <div th:if="${#lists.isEmpty(gastos)}" class="text-center text-muted py-5 small">
                    Nenhuma despesa registrada ainda.
                </div>

                <div th:if="${not #lists.isEmpty(gastos)}" class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                        <tr class="text-secondary small" style="font-size: 0.75rem;">
                            <th scope="col" class="px-3">Descrição</th>
                            <th scope="col">Fazenda</th>
                            <th scope="col">Data</th>
                            <th scope="col">Valor</th>
                            <th scope="col" class="text-center">Ações</th>
                        </tr>
                        </thead>
                        <tbody class="small text-dark">
                        <tr th:each="item : ${gastos}">
                            <td class="px-3 fw-semibold" th:text="${item.descricao}">Descrição</td>
                            <td class="text-secondary" th:text="${item.propriedade != null ? item.propriedade.nome : 'Sem vínculo'}">Fazenda</td>
                            <td class="text-muted" th:text="${item.dataGasto}">Data</td>
                            <td class="fw-bold text-danger" th:text="'R$ ' + ${item.valor}">R$ 0,00</td>
                            <td class="text-center">
                                <div class="d-flex justify-content-center gap-2">
                                    <!-- Botao que leva o gasto de volta para o form de edicao -->
                                    <a th:href="@{/gastos-view/editar/{id}(id=${item.id})}" class="btn btn-link p-0 text-decoration-none text-warning">
                                        <i class="bi bi-pencil-square fs-5"></i>
                                    </a>
                                    <!-- Botao de deletar despesa -->
                                    <a th:href="@{/gastos-view/excluir/{id}(id=${item.id})}" onclick="return confirm('Deseja apagar este gasto?')" class="btn btn-link p-0 text-decoration-none text-danger">
                                        <i class="bi bi-trash fs-5"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
