<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroGestor - Controle Financeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-logo {
            width: 38px; height: 38px; background-color: #198754; color: white;
            display: flex; align-items: center; justify-content: center; border-radius: 50%;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mt-3 mx-3 rounded-3">
    <div class="container-fluid px-3">
        <div class="d-flex align-items-center">
            <a th:href="@{/}" class="text-decoration-none d-flex align-items-center text-dark">
                <div class="navbar-logo me-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                    </svg>
                </div>
                <div>
                    <h2 class="navbar-brand mb-0 fw-bold fs-5">AgroGestor</h2>
                    <span class="text-muted small d-block" style="margin-top: -4px;">Fluxo de Caixa</span>
                </div>
            </a>
        </div>
    </div>
</nav>

<main class="container my-5" style="max-width: 1100px;">

    <div class="card border-0 bg-danger bg-opacity-10 text-danger p-4 mb-4 rounded-3 shadow-sm">
        <div class="d-flex align-items-center justify-content-between">
            <div>
                <span class="small fw-semibold text-uppercase tracking-wider">Custo Total Acumulado</span>
                <h2 class="display-6 fw-bold mb-0 mt-1" th:text="'R$ ' + ${totalGasto}">R$ 0,00</h2>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-12 col-lg-4">
            <div class="card border-light shadow-sm p-4 bg-white">
                <h3 class="h5 fw-bold text-dark mb-4">Lançar Despesa</h3>

                <form th:action="@{/gastos-view/salvar}" th:object="${novoGasto}" method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Descrição do Gasto</label>
                        <input type="text" th:field="*{descricao}" placeholder="Ex: Adubo, Combustível" class="form-control text-sm" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Valor (R$)</label>
                        <input type="number" step="0.01" th:field="*{valor}" placeholder="0.00" class="form-control text-sm" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Data</label>
                        <input type="date" th:field="*{dataGasto}" class="form-control text-sm" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Propriedade Vinculada</label>
                        <select th:field="*{propriedade}" class="form-select text-sm" required>
                            <option th:each="prop : ${propriedades}" th:value="${prop.id}" th:text="${prop.nome}">Fazenda</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-danger w-100 py-2 fw-medium mt-3">
                        Registrar Despesa
                    </button>
                </form>
            </div>
        </div>

        <div class="col-12 col-lg-8">
            <div class="card border-light shadow-sm p-4 bg-white h-100">
                <h3 class="h5 fw-bold text-dark mb-4">Histórico Financeiro</h3>

                <div th:if="${#lists.isEmpty(gastos)}" class="text-center text-muted py-5 small">
                    Nenhuma despesa registrada ainda.
                </div>

                <div th:if="${not #lists.isEmpty(gastos)}" class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                        <tr class="text-secondary small" style="font-size: 0.75rem;">
                            <th scope="col" class="px-3">Descrição</th>
                            <th scope="col">Fazenda</th>
                            <th scope="col">Data</th>
                            <th scope="col">Valor</th>
                            <th scope="col" class="text-center">Ações</th>
                        </tr>
                        </thead>
                        <tbody class="small text-dark">
                        <tr th:each="item : ${gastos}">
                            <td class="px-3 fw-semibold" th:text="${item.descricao}">Descrição</td>
                            <td class="text-secondary" th:text="${item.propriedade != null ? item.propriedade.nome : 'Sem vínculo'}">Fazenda</td>
                            <td class="text-muted" th:text="${item.dataGasto}">Data</td>
                            <td class="fw-bold text-danger" th:text="'R$ ' + ${item.valor}">R$ 0,00</td>
                            <td class="text-center">
                                <a th:href="@{/gastos-view/excluir/{id}(id=${item.id})}"
                                   onclick="return confirm('Deseja apagar este gasto?')"
                                   class="btn btn-link p-0 text-decoration-none text-danger">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-1.5 14.25a2.25 2.25 0 01-2.236 2.014H8.236A2.25 2.25 0 016 22.5L4.5 8.25m17.5 0l-1.135-4.811A2.25 2.25 0 0018.64 1.5H5.36a2.25 2.25 0 00-2.224 1.939L2 8.25m17.5 0H2m3.375 0h13.25" />
                                    </svg>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
