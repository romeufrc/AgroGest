<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroGestor - Perfil do Usuário</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
        background-color: #f8f9fa;
    }
    .navbar-logo {
        width: 38px;
        height: 38px;
        background-color: #198754;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
    }
    .profile-avatar {
        width: 90px;
        height: 90px;
        background-color: #198754;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        border-radius: 50%;
        margin: 0 auto 15px auto;
        box-shadow: 0 4px 10px rgba(25, 135, 84, 0.15);
    }
  </style>
</head>
<body>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<div class="d-flex">
  <div th:replace="~{sidebar :: sidebar}"></div>

  <div class="flex-grow-1">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mt-3 mx-3 rounded-3">
      <div class="container-fluid px-3 d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
          <button class="btn btn-link link-dark p-0 me-3 text-decoration-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarAgroGestor" aria-controls="sidebarAgroGestor">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>

          <a th:href="@{/}" class="text-decoration-none d-flex align-items-center text-dark">
            <div class="navbar-logo me-3">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v18M3 12h18M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 12M12 3c4.97 0 9 4.03 9 9 0 2.12-.74 4.07-1.97 5.61L12 12" />
              </svg>
            </div>
            <div>
              <h2 class="navbar-brand mb-0 fw-bold fs-5">AgroGestor</h2>
              <span class="text-muted small d-block" style="margin-top: -4px;">Configurações do Produtor</span>
            </div>
          </a>
        </div>
      </div>
    </nav>

    <main class="container my-5" style="max-width: 800px;">
      <div class="row g-4">

        <div class="col-12 col-md-4">
          <div class="card border-light shadow-sm p-4 bg-white text-center h-100">
            <div class="profile-avatar">
              <i class="bi bi-person-bounding-box"></i>
            </div>
            <h4 class="h6 fw-bold text-dark mb-1" th:text="${usuario.nome != null ? usuario.nome : 'Produtor Rural'}">Nome do Produtor</h4>
            <p class="text-muted small mb-0"><i class="bi bi-telephone me-1"></i> <span th:text="${usuario.telefone != null ? usuario.telefone : '(00) 00000-0000'}">Contato</span></p>
          </div>
        </div>

        <div class="col-12 col-md-8">
          <div class="card border-light shadow-sm p-4 bg-white h-100">
            <h3 class="h5 fw-bold text-dark mb-4">Informações de Segurança</h3>

            <form th:action="@{/perfil/salvar}" th:object="${usuario}" method="POST">
              <input type="hidden" th:field="*{id}">

              <div class="mb-3">
                <label class="form-label small fw-medium text-secondary">Nome Completo</label>
                <input type="text" th:field="*{nome}" placeholder="Seu nome" class="form-control text-sm" required>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-medium text-secondary">Telefone / Contato</label>
                <input type="text" th:field="*{telefone}" placeholder="(83) 99999-9999" class="form-control text-sm" required>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-medium text-secondary">Nova Senha de Acesso</label>
                <input type="password" th:field="*{senha}" placeholder="Digite sua senha atual ou uma nova" class="form-control text-sm" required>
              </div>

              <div class="d-flex justify-content-end gap-2 mt-4">
                <a th:href="@{/}" class="btn btn-light px-4 py-2 small fw-medium">Cancelar</a>
                <button type="submit" class="btn btn-success px-4 py-2 fw-medium">
                  Salvar Alterações
                </button>
              </div>
            </form>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
