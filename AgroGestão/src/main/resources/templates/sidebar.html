<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<div th:fragment="sidebar">
    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarAgroGestor" aria-labelledby="sidebarAgroGestorLabel" style="width: 280px;">
        <div class="offcanvas-header border-bottom ee-light">
            <div class="d-flex align-items-center gap-2">
                <div class="bg-success text-white rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 32px; height: 32px;">
                    <i class="bi bi-tree-fill"></i>
                </div>
                <h5 class="offcanvas-title fw-bold text-dark" id="sidebarAgroGestorLabel">AgroGestor</h5>
            </div>
            <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>

        <div class="offcanvas-body p-0">
            <div class="list-group list-group-flush">
                <a th:href="@{/}" class="list-group-item list-group-item-action py-3 px-4 border-0 d-flex align-items-center gap-3">
                    <i class="bi bi-speedometer2 fs-5 text-success"></i>
                    <span class="fw-medium">Tela Inicial</span>
                </a>
                <a th:href="@{/propriedades-view}" class="list-group-item list-group-item-action py-3 px-4 border-0 d-flex align-items-center gap-3">
                    <i class="bi bi-house-gear fs-5 text-success"></i>
                    <span class="fw-medium">Propriedades</span>
                </a>

                <a th:href="@{/safras-view}" class="list-group-item list-group-item-action py-3 px-4 border-0 d-flex align-items-center gap-3">
                    <i class="bi bi-calendar-event fs-5 text-success"></i>
                    <span class="fw-medium">Gerenciar Safras</span>
                </a>

                <a th:href="@{/atividades-view}" class="list-group-item list-group-item-action py-3 px-4 border-0 d-flex align-items-center gap-3">
                    <i class="bi bi-journal-check fs-5 text-success"></i>
                    <span class="fw-medium">Atividades</span>
                </a>
                <a th:href="@{/insumos-view}" class="list-group-item list-group-item-action py-3 px-4 border-0 d-flex align-items-center gap-3">
                    <i class="bi bi-box-seam fs-5 text-success"></i>
                    <span class="fw-medium">Estoque de Insumos</span>
                </a>
                <a th:href="@{/gastos-view}" class="list-group-item list-group-item-action py-3 px-4 border-0 d-flex align-items-center gap-3">
                    <i class="bi bi-cash-coin fs-5 text-success"></i>
                    <span class="fw-medium">Financeiro / Gastos</span>
                </a>
            </div>
        </div>

        <div class="p-3 border-top bg-light">
            <a th:href="@{/logout}" class="btn btn-outline-danger w-100 d-flex align-items-center justify-content-center gap-2 small fw-medium">
                <i class="bi bi-box-arrow-right"></i> Encerar Sessão
            </a>
        </div>
    </div>
</div>

</body>
</html>
