<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<!-- Estrutura da Sidebar Offcanvas (Fica escondida e só aparece ao clicar) -->
<div th:fragment="sidebar" class="offcanvas offcanvas-start text-white bg-dark" tabindex="-1" id="sidebarAgroGestor" aria-labelledby="sidebarAgroGestorLabel" style="width: 280px;">

    <!-- Cabeçalho da Sidebar -->
    <div class="offcanvas-header border-bottom border-secondary">
        <h5 class="offcanvas-title fw-bold d-flex align-items-center" id="sidebarAgroGestorLabel">
            <i class="bi bi-tree-fill me-2 text-success"></i> AgroGestor
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>

    <!-- Links de Navegação internos -->
    <div class="offcanvas-body d-flex flex-column justify-content-between">
        <ul class="nav nav-pills flex-column mb-auto gap-1">
            <li class="nav-item">
                <a href="/" class="nav-link text-white py-2.5">
                    <i class="bi bi-speedometer2 me-2 text-success"></i> Início
                </a>
            </li>
            <li>
                <a href="/propriedades-view" class="nav-link text-white py-2.5">
                    <i class="bi bi-houses me-2 text-success"></i> Fazendas
                </a>
            </li>
            <li>
                <a href="/atividades-view" class="nav-link text-white py-2.5">
                    <i class="bi bi-calendar-check me-2 text-success"></i> Atividades
                </a>
            </li>
            <li>
                <a href="/gastos-view" class="nav-link text-white py-2.5">
                    <i class="bi bi-cash-coin me-2 text-success"></i> Gastos
                </a>
            </li>
            <li>
                <a href="/insumos-view" class="nav-link text-white py-2.5">
                    <i class="bi bi-box-seam me-2 text-success"></i> Insumos
                </a>
            </li>
        </ul>
    </div>
</div>

</body>
</html>
