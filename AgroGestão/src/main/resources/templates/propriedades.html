<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroGestor - Propriedades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar-logo {
            width: 38px;
            height: 38px;
            background-color: #198754;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mt-3 mx-3 rounded-3">
    <div class="container-fluid px-3">
        <div class="d-flex align-items-center">
            <a th:href="@{/}" class="text-decoration-none d-flex align-items-center text-dark">
                <div class="navbar-logo me-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                    </svg>
                </div>
                <div>
                    <h2 class="navbar-brand mb-0 fw-bold fs-5">AgroGestor</h2>
                    <span class="text-muted small d-block" style="margin-top: -4px;">Gestão de Fazendas</span>
                </div>
            </a>
        </div>
    </div>
</nav>

<main class="container my-5" style="max-width: 1100px;">
    <div class="row g-4">

        <div class="col-12 col-lg-4">
            <div class="card border-light shadow-sm p-4 bg-white">
                <h3 class="h5 fw-bold text-dark mb-4">Nova Propriedade</h3>

                <form th:action="@{/propriedades-view/salvar}" th:object="${novaPropriedade}" method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Nome da Propriedade</label>
                        <input type="text" th:field="*{nome}" placeholder="Ex: Sítio Boa Vista" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Localização / Município</label>
                        <input type="text" th:field="*{localizacao}" placeholder="Ex: Soledade - PB" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Tamanho (Hectares)</label>
                        <input type="number" step="0.1" th:field="*{tamanho}" placeholder="Ex: 45.5" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 fw-medium mt-3">
                        Salvar Propriedade
                    </button>
                </form>
            </div>
        </div>

        <div class="col-12 col-lg-8">
            <div class="card border-light shadow-sm p-4 bg-white h-100">
                <h3 class="h5 fw-bold text-dark mb-4">Suas Propriedades Cadastradas</h3>

                <div th:if="${#lists.isEmpty(propriedades)}" class="text-center text-muted py-5 small">
                    Nenhuma propriedade cadastrada ainda. Use o formulário ao lado para começar!
                </div>

                <div th:if="${not #lists.isEmpty(propriedades)}" class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                        <tr class="text-secondary small uppercase" style="font-size: 0.75rem;">
                            <th scope="col" class="px-3">ID</th>
                            <th scope="col">Nome</th>
                            <th scope="col">Localização</th>
                            <th scope="col">Área (ha)</th>
                        </tr>
                        </thead>
                        <tbody class="small text-dark">
                        <tr th:each="prop : ${propriedades}">
                            <td class="px-3 text-muted font-monospace" style="font-size: 0.8rem;" th:text="${prop.id}">1</td>
                            <td class="fw-semibold text-dark" th:text="${prop.nome}">Sítio Exemplo</td>
                            <td class="text-secondary" th:text="${prop.localizacao}">Soledade</td>
                            <td class="fw-medium text-dark" th:text="${prop.tamanho}">0.0</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
