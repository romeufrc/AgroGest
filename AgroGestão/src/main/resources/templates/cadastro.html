<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroGestão - Criar Conta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .register-card {
            max-width: 380px;
            width: 100%;
            border-radius: 1rem;
        }
        .logo-circle {
            width: 48px;
            height: 48px;
            background-color: #198754;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 0 auto 1rem auto;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-screen">

<div class="card register-card shadow-sm p-4 mx-3 bg-white text-center">

    <div class="logo-circle">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v18M3 12h18M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 12M12 3c4.97 0 9 4.03 9 9 0 2.12-.74 4.07-1.97 5.61L12 12" />
        </svg>
    </div>

    <h1 class="h3 mb-1 fw-bold text-dark">Criar Conta</h1>
    <p class="text-muted small mb-4">Cadastre-se para gerenciar suas propriedades</p>

    <form th:action="@{/usuarios/cadastro}" th:object="${novoUsuario}" method="POST" class="text-start">

        <div class="mb-3">
            <label for="nome" class="form-label small fw-medium text-secondary">Nome Completo</label>
            <input type="text" id="nome" th:field="*{nome}" class="form-control" placeholder="Ex: Romeu Rodrigues" required>
        </div>

        <div class="mb-3">
            <label for="telefone" class="form-label small fw-medium text-secondary">Telefone</label>
            <input type="text" id="telefone" th:field="*{telefone}" class="form-control" placeholder="Ex: 83991360945" required>
        </div>

        <div class="mb-3">
            <label for="senha" class="form-label small fw-medium text-secondary">Senha de Acesso</label>
            <input type="password" id="senha" th:field="*{senha}" class="form-control" placeholder="••••••" required>
        </div>

        <button type="submit" class="btn btn-success w-full w-100 py-2 fw-medium mt-2">
            Cadastrar e Entrar
        </button>
    </form>

    <div class="mt-4 small text-muted">
        <p class="mb-0 text-secondary">Já tem uma conta? <a th:href="@{/login}" class="text-success fw-medium text-decoration-none">Fazer Login</a></p>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>>
