<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroGestor - Estoque de Insumos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar-logo {
            width: 38px;
            height: 38px;
            background-color: #198754;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mt-3 mx-3 rounded-3">
    <div class="container-fluid px-3">
        <div class="d-flex align-items-center">
            <a th:href="@{/}" class="text-decoration-none d-flex align-items-center text-dark">
                <div class="navbar-logo me-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                    </svg>
                </div>
                <div>
                    <h2 class="navbar-brand mb-0 fw-bold fs-5">AgroGestor</h2>
                    <span class="text-muted small d-block" style="margin-top: -4px;">Controle de Estoque</span>
                </div>
            </a>
        </div>
    </div>
</nav>

<main class="container my-5" style="max-width: 1100px;">
    <div class="row g-4">

        <div class="col-12 col-lg-4">
            <div class="card border-light shadow-sm p-4 bg-white">
                <h3 class="h5 fw-bold text-dark mb-4">Novo Insumo</h3>

                <form th:action="@{/insumos-view/salvar}" th:object="${novoInsumo}" method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Nome do Insumo</label>
                        <input type="text" th:field="*{nome}" placeholder="Ex: Semente de Soja" class="form-control text-sm" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Tipo / Categoria</label>
                        <select th:field="*{tipo}" class="form-select text-sm" required>
                            <option value="Semente">Semente</option>
                            <option value="Fertilizante">Fertilizante / Adubo</option>
                            <option value="Defensivo">Defensivo Agrícola</option>
                            <option value="Combustível">Combustível</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Quantidade Inicial</label>
                        <input type="number" step="0.1" th:field="*{quantidade}" placeholder="Ex: 150.0" class="form-control text-sm" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Unidade de Medida</label>
                        <select th:field="*{unidadeMedida}" class="form-select text-sm" required>
                            <option value="Sacas">Sacas</option>
                            <option value="Kg">Quilos (Kg)</option>
                            <option value="Litros">Litros (L)</option>
                            <option value="Toneladas">Toneladas (T)</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 fw-medium mt-3">
                        Cadastrar no Estoque
                    </button>
                </form>
            </div>
        </div>

        <div class="col-12 col-lg-8">
            <div class="card border-light shadow-sm p-4 bg-white h-100">
                <h3 class="h5 fw-bold text-dark mb-4">Inventário de Insumos Disponíveis</h3>

                <div th:if="${#lists.isEmpty(insumos)}" class="text-center text-muted py-5 small">
                    Nenhum insumo cadastrado no estoque. Adicione itens ao lado!
                </div>

                <div th:if="${not #lists.isEmpty(insumos)}" class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                        <tr class="text-secondary small" style="font-size: 0.75rem;">
                            <th scope="col" class="px-3">Item</th>
                            <th scope="col">Categoria</th>
                            <th scope="col">Qtd. Disponível</th>
                            <th scope="col">Unidade</th>
                            <th scope="col" class="text-center">Ações</th>
                        </tr>
                        </thead>
                        <tbody class="small text-dark">
                        <tr th:each="item : ${insumos}">
                            <td class="px-3 fw-semibold text-dark" th:text="${item.nome}">Insumo</td>
                            <td class="text-secondary" th:text="${item.tipo}">Categoria</td>

                            <td class="fw-bold"
                                th:classappend="${item.quantidade <= 10} ? 'text-danger' : 'text-success'"
                                th:text="${item.quantidade}">0.0</td>

                            <td>
                                <span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle" th:text="${item.unidadeMedida}">Unidade</span>
                            </td>

                            <td class="text-center">
                                <a th:href="@{/insumos-view/excluir/{id}(id=${item.id})}"
                                   onclick="return confirm('Deseja excluir este item do estoque?')"
                                   class="btn btn-link p-0 text-decoration-none text-danger">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-1.5 14.25a2.25 2.25 0 01-2.236 2.014H8.236A2.25 2.25 0 016 22.5L4.5 8.25m17.5 0l-1.135-4.811A2.25 2.25 0 0018.64 1.5H5.36a2.25 2.25 0 00-2.224 1.939L2 8.25m17.5 0H2m3.375 0h13.25" />
                                    </svg>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
