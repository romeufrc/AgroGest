<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroGestor - Atividades Agrícolas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-logo {
            width: 38px; height: 38px; background-color: #198754; color: white;
            display: flex; align-items: center; justify-content: center; border-radius: 50%;
        }
    </style>
</head>
<body>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<div th:replace="~{sidebar :: sidebar}"></div>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mt-3 mx-3 rounded-3">
    <div class="container-fluid px-3">
        <div class="d-flex align-items-center">
            <button class="btn btn-link link-dark p-0 me-3 text-decoration-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarAgroGestor" aria-controls="sidebarAgroGestor">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>

            <a th:href="@{/}" class="text-decoration-none d-flex align-items-center text-dark">
                <div class="navbar-logo me-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                    </svg>
                </div>
                <div>
                    <h2 class="navbar-brand mb-0 fw-bold fs-5">AgroGestor</h2>
                    <span class="text-muted small d-block" style="margin-top: -4px;">Manejos e Operações</span>
                </div>
            </a>
        </div>
    </div>
</nav>

<main class="container my-5" style="max-width: 1100px;">
    <div class="row g-4">

        <div class="col-12 col-lg-4">
            <div class="card border-light shadow-sm p-4 bg-white">
                <h3 class="h5 fw-bold text-dark mb-4" th:text="${novaAtividade.id != null} ? 'Editar Operação' : 'Nova Atividade'">Nova Atividade</h3>

                <form th:action="@{/atividades-view/salvar}" th:object="${novaAtividade}" method="POST">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Nome do Manejo</label>
                        <input type="text" th:field="*{nome}" placeholder="Ex: Plantio de Milho" class="form-control text-sm" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Tipo / Descrição</label>
                        <input type="text" th:field="*{descricao}" placeholder="Ex: Aplicação automatizada de sementes" class="form-control text-sm" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Data de Execução</label>
                        <input type="date" th:field="*{data}" class="form-control text-sm" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Propriedade Afetada</label>
                        <select th:field="*{propriedade}" class="form-select text-sm" required>
                            <option th:each="prop : ${propriedades}" th:value="${prop.id}" th:text="${prop.nome}">Fazenda</option>
                        </select>
                    </div>

                    <div class="d-flex gap-2 mt-3">
                        <a th:if="${novaAtividade.id != null}" th:href="@{/atividades-view}" class="btn btn-light w-50 py-2 fw-medium">Cancelar</a>
                        <button type="submit" class="btn btn-success fw-medium py-2" th:classappend="${novaAtividade.id != null} ? 'w-50' : 'w-100'">
                            Salvar Atividade
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-12 col-lg-8">
            <div class="card border-light shadow-sm p-4 bg-white h-100">
                <h3 class="h5 fw-bold text-dark mb-4">Registro Histórico de Campo</h3>

                <div th:if="${#lists.isEmpty(atividades)}" class="text-center text-muted py-5 small">
                    Nenhuma operação agrícola registrada nas fazendas.
                </div>

                <div th:if="${not #lists.isEmpty(atividades)}" class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                        <tr class="text-secondary small" style="font-size: 0.75rem;">
                            <th scope="col" class="px-3">Operação</th>
                            <th scope="col">Propriedade</th>
                            <th scope="col">Data</th>
                            <th scope="col" class="text-center">Ações</th>
                        </tr>
                        </thead>
                        <tbody class="small text-dark">
                        <tr th:each="atv : ${atividades}">
                            <td class="px-3 fw-semibold text-dark" th:text="${atv.nome}">Manejo</td>
                            <td class="text-secondary" th:text="${atv.propriedade != null ? atv.propriedade.nome : 'Sem vínculo'}">Fazenda</td>
                            <td class="text-muted" th:text="${atv.data}">Data</td>
                            <td class="text-center">
                                <div class="d-flex justify-content-center gap-2">
                                    <a th:href="@{/atividades-view/editar/{id}(id=${atv.id})}" class="btn btn-link p-0 text-decoration-none text-warning">
                                        <i class="bi bi-pencil-square fs-5"></i>
                                    </a>
                                    <a th:href="@{/atividades-view/excluir/{id}(id=${atv.id})}" onclick="return confirm('Deseja deletar esta atividade?')" class="btn btn-link p-0 text-decoration-none text-danger">
                                        <i class="bi bi-trash fs-5"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
