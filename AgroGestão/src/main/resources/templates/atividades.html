<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroGestor - Atividades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar-logo {
            width: 38px;
            height: 38px;
            background-color: #198754;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .activity-card {
            transition: background-color 0.15s ease-in-out;
        }
        .activity-card:hover {
            background-color: #f1f3f5 !important;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mt-3 mx-3 rounded-3">
    <div class="container-fluid px-3">
        <div class="d-flex align-items-center">
            <a th:href="@{/}" class="text-decoration-none d-flex align-items-center text-dark">
                <div class="navbar-logo me-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                    </svg>
                </div>
                <div>
                    <h2 class="navbar-brand mb-0 fw-bold fs-5">AgroGestor</h2>
                    <span class="text-muted small d-block" style="margin-top: -4px;">Histórico de Campo</span>
                </div>
            </a>
        </div>
    </div>
</nav>

<main class="container my-5" style="max-width: 1100px;">
    <div class="row g-4">

        <div class="col-12 col-lg-4">
            <div class="card border-light shadow-sm p-4 bg-white">
                <h3 class="h5 fw-bold text-dark mb-4">Nova Atividade</h3>

                <form th:action="@{/atividades-view/salvar}" th:object="${novaAtividade}" method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Nome da Atividade</label>
                        <input type="text" th:field="*{nome}" placeholder="Ex: Plantio de Safra" class="form-control text-sm" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Tipo de Atividade</label>
                        <select id="selectTipo" th:field="*{tipo}" class="form-select text-sm" onchange="verificarNovoTipo()" required>
                            <option value="Plantio">Plantio</option>
                            <option value="Irrigação">Irrigação</option>
                            <option value="Adubação">Adubação</option>
                            <option value="Colheita">Colheita</option>
                            <option value="Outro">Outro (Digitar...)</option>
                        </select>
                    </div>

                    <div class="mb-3 d-none" id="campoNovoTipoContainer">
                        <label class="form-label small fw-medium text-success">Digite o Novo Tipo</label>
                        <input type="text" id="inputNovoTipo" placeholder="Ex: Poda, Pulverização..." class="form-control text-sm">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Data da Operação</label>
                        <input type="date" th:field="*{data}" class="form-control text-sm" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Propriedade / Fazenda</label>
                        <select th:field="*{propriedade}" class="form-select text-sm" required>
                            <option value="" disabled selected>Selecione a fazenda...</option>
                            <option th:each="prop : ${propriedades}" th:value="${prop.id}" th:text="${prop.nome}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">Descrição / Detalhes</label>
                        <textarea th:field="*{descricao}" rows="3" placeholder="Ex: Utilizando sementes de Soja na área norte..." class="form-control text-sm" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 fw-medium mt-3">
                        Adicionar Atividade
                    </button>
                </form>
            </div>
        </div>

        <div class="col-12 col-lg-8">
            <div class="card border-light shadow-sm p-4 bg-white h-100">
                <h3 class="h5 fw-bold text-dark mb-4">Suas Atividades (Histórico Completo)</h3>

                <div th:if="${#lists.isEmpty(atividades)}" class="text-center text-muted py-5 small">
                    Nenhuma atividade de campo registrada. Preencha o formulário ao lado para começar!
                </div>

                <div th:if="${not #lists.isEmpty(atividades)}" class="d-flex flex-column gap-3">

                    <div th:each="ativ : ${atividades}" class="p-3 border rounded-3 bg-light d-flex justify-content-between align-items-start activity-card shadow-sm">
                        <div class="me-3">
                            <div class="d-flex align-items-center mb-2">
                                <span class="badge bg-success-subtle text-success border border-success-subtle me-2 fw-bold text-uppercase" style="font-size: 0.7rem;" th:text="${ativ.tipo}">Plantio</span>
                                <h4 class="h6 mb-0 fw-bold text-dark" th:text="${ativ.nome}">Nome da Atividade</h4>
                            </div>
                            <p class="text-muted mb-1 font-medium" style="font-size: 0.8rem;">
                                📍 Fazenda: <span class="text-dark fw-semibold" th:text="${ativ.propriedade != null ? ativ.propriedade.nome : 'Não vinculada'}">Sítio Exemplo</span>
                            </p>
                            <p class="text-secondary small mb-0" th:text="${ativ.descricao}">Descrição detalhada...</p>
                        </div>

                        <div class="d-flex flex-column align-items-end justify-content-between h-100 text-end" style="min-height: 65px;">
                            <span class="text-muted font-monospace small d-block" style="font-size: 0.8rem;" th:text="${ativ.data}">2026-05-17</span>

                            <a th:href="@{/atividades-view/excluir/{id}(id=${ativ.id})}"
                               onclick="return confirm('Tem certeza que deseja excluir esta atividade? Essa ação não pode ser desfeita.')"
                               class="text-secondary hover-danger btn btn-link p-0 text-decoration-none mt-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="text-danger">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                                </svg>
                            </a>
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>
</main>

<script>
    function verificarNovoTipo() {
        var select = document.getElementById("selectTipo");
        var containerInput = document.getElementById("campoNovoTipoContainer");
        var input = document.getElementById("inputNovoTipo");

        if (select.value === "Outro") {
            containerInput.classList.remove("d-none");
            input.required = true;
            input.name = "tipo"; // O input passa a enviar o valor para a rota do Java
            select.name = "";    // Desativa o select para não dar conflito
        } else {
            containerInput.classList.add("d-none");
            input.required = false;
            input.name = "";
            select.name = "tipo"; // O select volta a comandar o envio padrão
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
